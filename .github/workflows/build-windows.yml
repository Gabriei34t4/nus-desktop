name: Windows build and tests

on:
  push:
    branches:
      - feat/pt-br-ai-providers
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare local voice runtime
        run: npm run setup:voice
      - name: Run tests
        run: npm test
      - name: Check packaged app security
        run: npm run dist:check
      - name: Build Windows installer and portable app
        run: npm run dist
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Nus-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7
